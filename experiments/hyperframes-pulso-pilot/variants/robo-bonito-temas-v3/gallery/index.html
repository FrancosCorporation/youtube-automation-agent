<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>As cores do Pulso</title>
<style>
:root{color-scheme:dark;--accent:#22D3EE}*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#f3f7fc;font:17px/1.5 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:30px 22px 60px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px;letter-spacing:-.03em}h2{font-size:23px;margin:35px 0 8px}p{color:#b9c9dc;max-width:800px;margin:0 0 20px}.picker{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:22px 0}select{font:inherit;padding:12px 16px;max-width:100%;border:1px solid #526175;border-radius:10px;background:#142131;color:#f3f7fc}.swatch{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-right:8px}#label{color:var(--accent)}img,video{display:block;width:100%;border-radius:12px;background:#142131}img{height:auto;aspect-ratio:16/9;object-fit:contain}video{aspect-ratio:16/9}a{color:#90dff1}nav{display:flex;flex-wrap:wrap;gap:20px;margin-top:18px}select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}@media(max-width:550px){main{padding:24px 14px}p{font-size:16px}}
</style><style>
.overview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:25px 0 30px}.sample{font:inherit;color:#f3f7fc;padding:10px 8px 14px;background:#142131;border:2px solid var(--sample-color);border-radius:12px;cursor:pointer}.sample img{aspect-ratio:1;height:auto;background:transparent;border-radius:0}.sample span,.sample small{display:block}.sample span{font-size:14px;margin-top:8px}.sample small{font-size:13px;color:var(--sample-color)}.sample[aria-pressed="true"]{background:#253b50;box-shadow:0 0 0 2px var(--sample-color)}.sample:focus-visible{outline:3px solid #f1f5f9;outline-offset:3px}@media(max-width:700px){.overview{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main>
<h1>As cores do Pulso</h1><p>O mesmo personagem, com os olhos, a boca e os detalhes nas cores de cada tema. Escolha uma paleta para comparar.</p>
<div class="overview" aria-label="Comparação das cores por tema"><button class="sample" type="button" data-theme="ia" style="--sample-color:#22D3EE"><img src="ia-robot.png" alt="" loading="lazy"><span>Pulso IA</span><small>Ciano</small></button><button class="sample" type="button" data-theme="curiosidades" style="--sample-color:#FDE047"><img src="curiosidades-robot.png" alt="" loading="lazy"><span>Pulso Curiosidades</span><small>Amarelo</small></button><button class="sample" type="button" data-theme="dinheiro" style="--sample-color:#22C55E"><img src="dinheiro-robot.png" alt="" loading="lazy"><span>Pulso Dinheiro</span><small>Verde-esmeralda</small></button><button class="sample" type="button" data-theme="saude" style="--sample-color:#F1F5F9"><img src="saude-robot.png" alt="" loading="lazy"><span>Pulso Saúde</span><small>Branco-gelo</small></button><button class="sample" type="button" data-theme="economize" style="--sample-color:#FB923C"><img src="economize-robot.png" alt="" loading="lazy"><span>Pulso Economia</span><small>Laranja</small></button><button class="sample" type="button" data-theme="psicologia" style="--sample-color:#C084FC"><img src="psicologia-robot.png" alt="" loading="lazy"><span>Pulso Mente</span><small>Violeta</small></button><button class="sample" type="button" data-theme="relacionamentos" style="--sample-color:#F472B6"><img src="relacionamentos-robot.png" alt="" loading="lazy"><span>Pulso Relações</span><small>Rosa</small></button><button class="sample" type="button" data-theme="fitness" style="--sample-color:#F87171"><img src="fitness-robot.png" alt="" loading="lazy"><span>Pulso Fitness</span><small>Vermelho</small></button><button class="sample" type="button" data-theme="misterios" style="--sample-color:#60A5FA"><img src="misterios-robot.png" alt="" loading="lazy"><span>Pulso Mistérios</span><small>Azul-royal</small></button><button class="sample" type="button" data-theme="carreira" style="--sample-color:#BFA07A"><img src="carreira-robot.png" alt="" loading="lazy"><span>Pulso Carreira</span><small>Cobre</small></button></div>
<div class="picker"><label for="theme">Tema</label><select id="theme"><option value="ia">Pulso IA</option><option value="curiosidades">Pulso Curiosidades</option><option value="dinheiro">Pulso Dinheiro</option><option value="saude">Pulso Saúde</option><option value="economize">Pulso Economia</option><option value="psicologia">Pulso Mente</option><option value="relacionamentos">Pulso Relações</option><option value="fitness">Pulso Fitness</option><option value="misterios">Pulso Mistérios</option><option value="carreira">Pulso Carreira</option></select><span id="label"><span class="swatch"></span><span id="color">Ciano</span></span></div>
<img id="preview" src="ia.png" alt="Robô Pulso no tema Inteligência Artificial" width="1920" height="1080">
<h2>Veja em movimento</h2><p>Teste com a paleta de IA: fala, sorriso, piscadas e gestos.</p>

</main><script>
const palettes=[{"id":"ia","brand":"Pulso IA","colorName":"Ciano","paletteIndex":1,"accents":["#22D3EE","#38BDF8","#E0F2FE","#67E8F9"],"image":"ia.png","robotImage":"ia-robot.png","visibleFraction":0.22479752218934912},{"id":"curiosidades","brand":"Pulso Curiosidades","colorName":"Amarelo","paletteIndex":0,"accents":["#FDE047","#FBBF24","#FEF08A","#FFF7CC"],"image":"curiosidades.png","robotImage":"curiosidades-robot.png","visibleFraction":0.22479752218934912},{"id":"dinheiro","brand":"Pulso Dinheiro","colorName":"Verde-esmeralda","paletteIndex":0,"accents":["#22C55E","#4ADE80","#86EFAC","#DCFCE7"],"image":"dinheiro.png","robotImage":"dinheiro-robot.png","visibleFraction":0.22479752218934912},{"id":"saude","brand":"Pulso Saúde","colorName":"Branco-gelo","paletteIndex":0,"accents":["#F1F5F9","#CBD5E1","#E2E8F0","#FFFFFF"],"image":"saude.png","robotImage":"saude-robot.png","visibleFraction":0.22479752218934912},{"id":"economize","brand":"Pulso Economia","colorName":"Laranja","paletteIndex":0,"accents":["#FB923C","#FDBA74","#FED7AA","#FFF7ED"],"image":"economize.png","robotImage":"economize-robot.png","visibleFraction":0.22479752218934912},{"id":"psicologia","brand":"Pulso Mente","colorName":"Violeta","paletteIndex":0,"accents":["#C084FC","#A78BFA","#D8B4FE","#F3E8FF"],"image":"psicologia.png","robotImage":"psicologia-robot.png","visibleFraction":0.22479752218934912},{"id":"relacionamentos","brand":"Pulso Relações","colorName":"Rosa","paletteIndex":0,"accents":["#F472B6","#F9A8D4","#FBCFE8","#FDF2F8"],"image":"relacionamentos.png","robotImage":"relacionamentos-robot.png","visibleFraction":0.22479752218934912},{"id":"fitness","brand":"Pulso Fitness","colorName":"Vermelho","paletteIndex":0,"accents":["#F87171","#EF4444","#FCA5A5","#FEE2E2"],"image":"fitness.png","robotImage":"fitness-robot.png","visibleFraction":0.22479752218934912},{"id":"misterios","brand":"Pulso Mistérios","colorName":"Azul-royal","paletteIndex":0,"accents":["#60A5FA","#3B82F6","#93C5FD","#DBEAFE"],"image":"misterios.png","robotImage":"misterios-robot.png","visibleFraction":0.22479752218934912},{"id":"carreira","brand":"Pulso Carreira","colorName":"Cobre","paletteIndex":0,"accents":["#BFA07A","#D6BB97","#E8D8BF","#F5EEE4"],"image":"carreira.png","robotImage":"carreira-robot.png","visibleFraction":0.22479752218934912}];const select=document.getElementById('theme');
function update(){const p=palettes.find(p=>p.id===select.value);document.getElementById('preview').src=p.image;document.getElementById('preview').alt='Robô no tema '+p.brand;document.documentElement.style.setProperty('--accent',p.accents[0]);document.getElementById('color').textContent=(p.colorName?p.colorName+' · ':'')+p.accents[0];document.querySelectorAll('.sample').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===p.id)));}
document.querySelectorAll('.sample').forEach(b=>b.addEventListener('click',()=>{select.value=b.dataset.theme;update();}));
select.addEventListener('change',update);update();
</script></body></html>
