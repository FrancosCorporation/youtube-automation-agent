[Service]
Environment=PULSO_CONSTRAINED_RENDER=1
Environment=PULSO_RENDER_WITH_TRAINING=1
Environment=PULSO_PIPELINED_PRODUCTION=1
Environment=SCRIPT_WRITER_PREFERRED_MODEL=gemini:gemini-3.5-flash-lite
Environment=NVIDIA_CALLS_PER_DAY=600
Environment=GEMINI_CALLS_PER_DAY=600
Environment=PULSO_REMOTION_GL=angle
Environment=RENDER_WORKERS=1
# Keep the default strict for ad-hoc runs, but let the supervised producer
# recover from transient Edge word-boundary/provider failures. The generator
# tries regular Edge TTS first and gTTS only as the final fallback.
Environment=TTS_ALLOW_PROVIDER_FALLBACK=1
Environment=PULSO_DETERMINISTIC_SCENE_FALLBACK=1
# The scheduler is pinned to six CPUs and low priority; allow the shared
# profile to start while the external trainer drives host load near 110% of
# the nominal host capacity; memory, swap and VRAM checks remain mandatory.
Environment=PULSO_SHARED_RENDER_LOAD_RATIO=1.10
Nice=10
CPUAffinity=22 23 24 25 26 27
CPUQuota=300%
MemoryHigh=4G
MemoryMax=6G
